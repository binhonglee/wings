version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  linux:
    machine:
      image: ubuntu-2204:2024.11.1

jobs:
  build_core:
    parameters:
      os:
        type: executor
      version:
        type: string
    executor: << parameters.os >>
    environment:
      CHOOSENIM_NO_ANALYTICS: 1
    working_directory: ~/wings
    steps:
      - checkout
      - restore_cache:
          key: nim-<< parameters.version >>
      - run:
          name: Install dependencies
          command: |
            if ! type -P choosenim &> /dev/null; then
              echo "Fresh install"
              export CHOOSENIM_CHOOSE_VERSION=<< parameters.version >>
              curl https://nim-lang.org/choosenim/init.sh -sSf > init.sh
              sh init.sh -y
            else
              echo "Already installed"
              rm -rf $HOME/.choosenim/current
              choosenim update self
              choosenim << parameters.version >>
            fi
      - run:
          name: Add nimble to path
          command: |
            echo 'export PATH=~/.nimble/bin:$PATH' >> $BASH_ENV
            source "$BASH_ENV"
      - run:
          name: Install stones
          command: nimble install stones
      - run:
          name: Install checksums
          command: nimble install checksums
      - run:
          name: Build staticlang
          command: nim c -d:ssl src/main/staticlang/main.nim
      - run:
          name: Build wings
          command: nim c -d:ssl src/main/wings.nim
      - run:
          name: Run core test
          command: ./scripts/test.sh
      - save_cache:
          key: nim-<< parameters.version >>
          paths:
            - .nimble
  build_tsutil:
    parameters:
      os:
        type: executor
    executor: node/default
    working_directory: ~/wings/src/tsUtil
    steps:
      - checkout:
          path: ~/wings
      - restore_cache:
          key: node_modules-{{ checksum "package-lock.json" }}
      - node/install-packages:
          cache-path: ~/wings/src/tsUtil/node_modules
          override-ci-command: npm install
      - run:
          name: Test / Cover
          command: npm run cover
      - save_cache:
          key: node_modules-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - save_cache:
          key: nyc_report-{{ checksum "." }}
          paths:
            - ../../report
            - .nyc_output

workflows:
  workflow:
    jobs:
      - build_core:
          name: core-v<< matrix.version >>
          matrix:
            parameters:
              os: [linux]
              version: ["2.2.0", "stable"]
      - build_tsutil:
          name: tsutil
          matrix:
            parameters:
              os: [linux]
